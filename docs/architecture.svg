<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#232f3e">AWS Architecture – ALB (HTTPS) → Auto Scaling EC2 (blue/green) → RDS MySQL</text>

  <!-- actors -->
  <rect x="20" y="70" width="110" height="46" rx="6" fill="#eef2f7" stroke="#232f3e"/><text x="75" y="98" text-anchor="middle">Users / Internet</text>
  <rect x="20" y="150" width="110" height="46" rx="6" fill="#eef2f7" stroke="#232f3e"/><text x="75" y="171" text-anchor="middle">Route 53</text><text x="75" y="187" text-anchor="middle" font-size="11">A alias + ACM DNS</text>
  <rect x="20" y="230" width="110" height="60" rx="6" fill="#eef2f7" stroke="#232f3e"/><text x="75" y="252" text-anchor="middle">GitHub Actions</text><text x="75" y="268" text-anchor="middle" font-size="11">OIDC → IAM role</text><text x="75" y="282" text-anchor="middle" font-size="11">Terraform + deploy</text>

  <!-- VPC -->
  <rect x="160" y="50" width="640" height="560" rx="10" fill="#f8fbff" stroke="#8c4fff" stroke-width="2"/>
  <text x="172" y="70" font-weight="bold" fill="#8c4fff">VPC 10.20.0.0/16 (2 Availability Zones)</text>
  <rect x="150" y="82" width="30" height="30" rx="4" fill="#8c4fff"/><text x="165" y="102" text-anchor="middle" fill="#fff" font-size="11">IGW</text>

  <!-- AZ columns -->
  <rect x="180" y="82" width="300" height="512" rx="6" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="330" y="98" text-anchor="middle" fill="#666">Availability Zone A</text>
  <rect x="500" y="82" width="290" height="512" rx="6" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="645" y="98" text-anchor="middle" fill="#666">Availability Zone B</text>

  <!-- public subnets -->
  <rect x="192" y="108" width="276" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="200" y="124" fill="#2e7d32" font-weight="bold">Public subnet</text>
  <rect x="210" y="136" width="110" height="40" rx="4" fill="#fff" stroke="#2e7d32"/><text x="265" y="160" text-anchor="middle">ALB node</text>
  <rect x="340" y="136" width="110" height="40" rx="4" fill="#fff" stroke="#2e7d32"/><text x="395" y="154" text-anchor="middle">NAT Gateway</text><text x="395" y="168" text-anchor="middle" font-size="11">(single or per-AZ)</text>
  <rect x="512" y="108" width="266" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="520" y="124" fill="#2e7d32" font-weight="bold">Public subnet</text>
  <rect x="530" y="136" width="110" height="40" rx="4" fill="#fff" stroke="#2e7d32"/><text x="585" y="160" text-anchor="middle">ALB node</text>

  <!-- ALB bar -->
  <rect x="210" y="190" width="568" height="28" rx="4" fill="#ffe0b2" stroke="#e65100"/>
  <text x="494" y="209" text-anchor="middle" font-size="12">Application Load Balancer · HTTPS :443 (ACM, TLS 1.3) · :80 → 301 · weighted blue/green</text>

  <!-- private app subnets -->
  <rect x="192" y="250" width="276" height="150" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="200" y="266" fill="#1565c0" font-weight="bold">Private subnet (app)</text>
  <rect x="210" y="278" width="115" height="52" rx="4" fill="#fff" stroke="#1565c0"/><text x="267" y="300" text-anchor="middle">EC2 (blue ASG)</text><text x="267" y="316" text-anchor="middle" font-size="11">Node.js :3000</text>
  <rect x="340" y="278" width="115" height="52" rx="4" fill="#fff" stroke="#2e7d32"/><text x="397" y="300" text-anchor="middle">EC2 (green ASG)</text><text x="397" y="316" text-anchor="middle" font-size="11">Node.js :3000</text>
  <text x="330" y="355" text-anchor="middle" font-size="11" fill="#555">SG: inbound :3000 from ALB SG only</text>
  <text x="330" y="372" text-anchor="middle" font-size="11" fill="#555">IMDSv2 · encrypted EBS · SSM (no SSH)</text>
  <rect x="512" y="250" width="266" height="150" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="520" y="266" fill="#1565c0" font-weight="bold">Private subnet (app)</text>
  <rect x="530" y="278" width="115" height="52" rx="4" fill="#fff" stroke="#1565c0"/><text x="587" y="300" text-anchor="middle">EC2 (blue ASG)</text><text x="587" y="316" text-anchor="middle" font-size="11">Node.js :3000</text>
  <rect x="660" y="278" width="105" height="52" rx="4" fill="#fff" stroke="#2e7d32"/><text x="712" y="300" text-anchor="middle">EC2 (green ASG)</text><text x="712" y="316" text-anchor="middle" font-size="11">Node.js :3000</text>

  <!-- DB subnets -->
  <rect x="192" y="425" width="276" height="100" rx="6" fill="#fce4ec" stroke="#ad1457"/>
  <text x="200" y="441" fill="#ad1457" font-weight="bold">Isolated DB subnet (no internet route)</text>
  <rect x="215" y="455" width="230" height="52" rx="4" fill="#fff" stroke="#ad1457"/><text x="330" y="477" text-anchor="middle">RDS MySQL 8.0 – primary</text><text x="330" y="494" text-anchor="middle" font-size="11">encrypted · SG :3306 from app SG</text>
  <rect x="512" y="425" width="266" height="100" rx="6" fill="#fce4ec" stroke="#ad1457"/>
  <text x="520" y="441" fill="#ad1457" font-weight="bold">Isolated DB subnet</text>
  <rect x="535" y="455" width="220" height="52" rx="4" fill="#fff" stroke="#ad1457"/><text x="645" y="477" text-anchor="middle">RDS MySQL – read replica</text><text x="645" y="494" text-anchor="middle" font-size="11">(Multi-AZ standby optional in prod)</text>
  <path d="M445 481 H535" stroke="#ad1457" stroke-width="2" stroke-dasharray="5 3"/><text x="490" y="474" text-anchor="middle" font-size="10" fill="#ad1457">async repl.</text>

  <!-- S3 endpoint -->
  <rect x="192" y="538" width="586" height="40" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="485" y="563" text-anchor="middle" fill="#4a148c">S3 Gateway VPC Endpoint (private route from app subnets to S3)</text>

  <!-- right column: regional services -->
  <rect x="820" y="70" width="165" height="62" rx="6" fill="#fff8e1" stroke="#f9a825"/><text x="902" y="94" text-anchor="middle">Secrets Manager</text><text x="902" y="112" text-anchor="middle" font-size="11">DB credentials (JSON)</text>
  <rect x="820" y="150" width="165" height="62" rx="6" fill="#fff8e1" stroke="#f9a825"/><text x="902" y="174" text-anchor="middle">IAM role / profile</text><text x="902" y="192" text-anchor="middle" font-size="11">least privilege</text>
  <rect x="820" y="230" width="165" height="62" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/><text x="902" y="254" text-anchor="middle">S3: app bucket</text><text x="902" y="272" text-anchor="middle" font-size="11">SSE-S3 · versioned</text>
  <rect x="820" y="310" width="165" height="62" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/><text x="902" y="334" text-anchor="middle">S3: ALB access logs</text><text x="902" y="352" text-anchor="middle" font-size="11">lifecycle-expired</text>
  <rect x="820" y="390" width="165" height="62" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/><text x="902" y="414" text-anchor="middle">S3: releases + tfstate</text><text x="902" y="432" text-anchor="middle" font-size="11">(bootstrap stack)</text>
  <rect x="820" y="470" width="165" height="62" rx="6" fill="#fff8e1" stroke="#f9a825"/><text x="902" y="494" text-anchor="middle">ACM certificate</text><text x="902" y="512" text-anchor="middle" font-size="11">DNS-validated</text>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#232f3e"/></marker></defs>
  <path d="M130 93 H150" stroke="#232f3e" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M165 112 V204 H210" stroke="#232f3e" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="134" y="86" font-size="10">HTTPS</text>
  <path d="M267 218 V278" stroke="#232f3e" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M587 218 V278" stroke="#232f3e" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M330 330 V455" stroke="#ad1457" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="336" y="400" font-size="11" fill="#ad1457">MySQL :3306 (TLS)</text>
  <path d="M778 212 H800 V341 H820" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text x="803" y="270" font-size="10" fill="#6a1b9a">logs</text>
</svg>
