# Local run:  docker compose up --build   ->  http://localhost:3000
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20
  app:
    build: ./app
    environment:
      DB_HOST: db
      APP_COLOR: local
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
